services:
  postgres:
    image: postgres:17
    container_name: jovinka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jovinka_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: jovinka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  redisinsight:
    image: redis/redisinsight:latest
    container_name: jovinka-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

  adminer:
    image: adminer
    container_name: jovinka-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: